  const [busqueda, setBusqueda] = useState("");
  const [seleccionado, setSeleccionado] = useState(null);

  // Agrupar por mail OR celular
  const grupos = {};
  recs.forEach(r => {
    const mail = (r.email||"").toLowerCase().trim();
    const cel = (r.celular||"").replace(/\D/g,"").trim();
    let keyExistente = null;
    if(mail) keyExistente = Object.keys(grupos).find(k => grupos[k].mails.includes(mail));
    if(!keyExistente && cel) keyExistente = Object.keys(grupos).find(k => grupos[k].celulares.includes(cel));
    const key = keyExistente || (mail || cel || "anon_"+r.id);
    if(!grupos[key]) grupos[key] = {nombre:r.nombre||"—", mail, celular:r.celular||"", tipo:r.tipo||"—", mails:[], celulares:[], tickets:[], sumCalif:0, countCalif:0, reabiertos:0};
    if(mail && !grupos[key].mails.includes(mail)) grupos[key].mails.push(mail);
    if(cel && !grupos[key].celulares.includes(cel)) grupos[key].celulares.push(cel);
    grupos[key].tickets.push(r);
    if(r.calificacion) { grupos[key].sumCalif+=r.calificacion; grupos[key].countCalif++; }
    if(r.reabierta) grupos[key].reabiertos++;
  });

  const solicitantes = Object.values(grupos).map(g => ({
    ...g,
    total: g.tickets.length,
    ultimoTicket: [...g.tickets].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0],
    califPromedio: g.countCalif>0 ? Math.round(g.sumCalif/g.countCalif*10)/10 : null
  }));

  const top10 = [...solicitantes].sort((a,b)=>b.total-a.total).slice(0,10);

  const toggleSort = (col) => {
    if(sortBy===col) setSortDir(d=>d==="asc"?"desc":"asc");
    else { setSortBy(col); setSortDir("desc"); }
  };

  const filtrados = solicitantes
    .filter(s => !filtroTipo || s.tipo===filtroTipo)
    .filter(s => !busqueda || s.nombre.toLowerCase().includes(busqueda.toLowerCase()) || s.mail.includes(busqueda.toLowerCase()))
    .sort((a,b) => {
      const va = sortBy==="total"?a.total : sortBy==="calif"?(a.califPromedio||0) : sortBy==="ultimo"?new Date(a.ultimoTicket?.createdAt||0) : a.nombre;
      const vb = sortBy==="total"?b.total : sortBy==="calif"?(b.califPromedio||0) : sortBy==="ultimo"?new Date(b.ultimoTicket?.createdAt||0) : b.nombre;
      return sortDir==="desc" ? (vb>va?1:-1) : (va>vb?1:-1);
    });

  const thS = {padding:"8px 12px",textAlign:"left",color:"#64748b",fontWeight:600,fontSize:11,borderBottom:"2px solid #f1f5f9",cursor:"pointer",whiteSpace:"nowrap",userSelect:"none"};
  const si = (col) => sortBy===col ? (sortDir==="desc"?" ↓":" ↑") : " ↕";

  return h('div',null,
    sectionTitle("Solicitantes", solicitantes.length+" solicitantes únicos identificados"),

    h('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}},
      h('div',{style:card()},
        h('div',{style:{fontSize:14,fontWeight:700,color:"#1a3a6b",marginBottom:16}},"Top 10 por volumen de tickets"),
        h(ChartBox,{id:"top-sol",type:"bar",height:220,
          data:{labels:top10.map(s=>s.nombre.split(" ")[0]),
            datasets:[{label:"Tickets",data:top10.map(s=>s.total),backgroundColor:top10.map((_,i)=>COLORS[i%COLORS.length]),borderRadius:4}]},
          options:{indexAxis:"y",scales:{x:{grid:{color:"#f1f5f9"}},y:{grid:{display:false}}},plugins:{legend:{display:false}}}})),
      h('div',{style:card()},
        h('div',{style:{fontSize:14,fontWeight:700,color:"#1a3a6b",marginBottom:16}},"Distribución por tipo"),
        h(ChartBox,{id:"dist-tipo",type:"doughnut",height:220,
          data:{labels:["Socio","Empleado","Directivo","Otro"],
            datasets:[{data:[
              solicitantes.filter(s=>s.tipo==="socio").length,
              solicitantes.filter(s=>s.tipo==="empleado").length,
              solicitantes.filter(s=>s.tipo==="directivo").length,
              solicitantes.filter(s=>!["socio","empleado","directivo"].includes(s.tipo)).length
            ],backgroundColor:["#3b82f6","#8b5cf6","#22c55e","#94a3b8"],borderWidth:2,borderColor:"white"}]},
          options:{plugins:{legend:{position:"bottom"}}}}))),

    h('div',{style:{...card(),marginBottom:28}},
      h('div',{style:{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}},
        h('input',{value:busqueda,onChange:e=>setBusqueda(e.target.value),placeholder:"Buscar nombre o mail...",
          style:{padding:"8px 12px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,flex:1,minWidth:180,outline:"none"}}),
        h('select',{value:filtroTipo,onChange:e=>setFiltroTipo(e.target.value),
          style:{padding:"8px 12px",border:"1.5px solid #e2e8f0",borderRadius:8,fontSize:13,outline:"none"}},
          h('option',{value:""},"Todos los tipos"),
          h('option',{value:"socio"},"Socios"),
          h('option',{value:"empleado"},"Empleados"),
          h('option',{value:"directivo"},"Directivos")),
        h('div',{style:{fontSize:12,color:"#94a3b8"}},filtrados.length+" resultados")),

      h('div',{style:{overflowX:"auto"}},
        h('table',{style:{width:"100%",borderCollapse:"collapse",fontSize:13}},
          h('thead',null,h('tr',{style:{background:"#f8fafc"}},
            h('th',{style:thS,onClick:()=>toggleSort("nombre")},"Nombre"+si("nombre")),
            h('th',{style:thS},"Contacto"),
            h('th',{style:thS},"Tipo"),
            h('th',{style:{...thS,textAlign:"center"},onClick:()=>toggleSort("total")},"Tickets"+si("total")),
            h('th',{style:{...thS,textAlign:"center"},onClick:()=>toggleSort("calif")},"Calif."+si("calif")),
            h('th',{style:{...thS,textAlign:"center"}},"Reabiertos"),
            h('th',{style:thS,onClick:()=>toggleSort("ultimo")},"Último"+si("ultimo")),
            h('th',{style:thS},""))),
          h('tbody',null,...filtrados.slice(0,50).map((s,i)=>
            h('tr',{key:i,style:{borderBottom:"1px solid #f8fafc",background:i%2===0?"white":"#fafafa"}},
              h('td',{style:{padding:"10px 12px",fontWeight:600,color:"#1e293b"}},s.nombre),
              h('td',{style:{padding:"10px 12px",color:"#64748b",fontSize:12}},
                h('div',null,s.mail),
                s.celular&&h('div',{style:{color:"#94a3b8"}},s.celular)),
              h('td',{style:{padding:"10px 12px"}},
                h('span',{style:{padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,
                  background:s.tipo==="socio"?"#eff6ff":s.tipo==="empleado"?"#f5f3ff":"#f0fdf4",
                  color:s.tipo==="socio"?"#3b82f6":s.tipo==="empleado"?"#7c3aed":"#16a34a"}},s.tipo||"—")),
              h('td',{style:{padding:"10px 12px",textAlign:"center"}},
                h('span',{style:{background:"#eff6ff",color:"#3b82f6",fontWeight:700,padding:"3px 10px",borderRadius:20,fontSize:12}},s.total)),
              h('td',{style:{padding:"10px 12px",textAlign:"center",fontWeight:700,
                color:s.califPromedio>=4?"#16a34a":s.califPromedio>=3?"#ca8a04":s.califPromedio?"#dc2626":"#94a3b8"}},
                s.califPromedio?"★ "+s.califPromedio:"—"),
              h('td',{style:{padding:"10px 12px",textAlign:"center",color:s.reabiertos>0?"#ef4444":"#22c55e",fontWeight:600}},s.reabiertos||"0"),
              h('td',{style:{padding:"10px 12px",color:"#94a3b8",fontSize:12}},s.ultimoTicket?fd(s.ultimoTicket.createdAt):"—"),
              h('td',{style:{padding:"10px 12px"}},
                h('button',{onClick:()=>setSeleccionado(seleccionado?.mail===s.mail?null:s),
                  style:{padding:"4px 10px",background:"#f1f5f9",border:"none",borderRadius:6,cursor:"pointer",fontSize:11,fontWeight:600,color:"#374151"}},
                  seleccionado?.mail===s.mail?"Cerrar":"Ver historial")))))),

      seleccionado && h('div',{style:{marginTop:16,background:"#f8fafc",borderRadius:12,padding:16,border:"1.5px solid #e2e8f0"}},
        h('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
          h('div',{style:{fontWeight:700,color:"#1e293b",fontSize:14}},"Historial de "+seleccionado.nombre),
          h('div',{style:{fontSize:12,color:"#64748b"}},seleccionado.tickets.length+" tickets")),
        h('div',{style:{display:"flex",flexDirection:"column",gap:8}},
          ...[...seleccionado.tickets].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))
            .map((t,i)=>h('div',{key:i,style:{background:"white",borderRadius:8,padding:"10px 14px",border:"1px solid #e2e8f0",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}},
              h('div',null,
                h('span',{style:{fontFamily:"monospace",fontWeight:700,color:"#3b82f6",fontSize:12}},t.numero),
                h('span',{style:{color:"#64748b",fontSize:12}}," — "+t.sector+" / "+t.sub)),
              h('div',{style:{display:"flex",gap:8,alignItems:"center"}},
                h('span',{style:{fontSize:11,color:"#94a3b8"}},fd(t.createdAt)),
                h('span',{style:{padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700,
                  background:t.estadoAvance==="completada"?"#f0fdf4":"#f1f5f9",
                  color:t.estadoAvance==="completada"?"#16a34a":"#64748b"}},t.estadoAvance),
                t.calificacion&&h('span',{style:{color:"#f97316",fontWeight:700,fontSize:12}},"★"+t.calificacion)))))))));
}

// ── DASHBOARD DE MÉTRICAS ──────────────────────────────────────────────────
function DashboardPanel({recs}) {
  const [filtroArea, setFiltroArea] = useState("todas");
  const [filtroPeriodo, setFiltroPeriodo] = useState("all");
  const [filtroAreaTendencia, setFiltroAreaTendencia] = useState("todas");
  const [granularidad, setGranularidad] = useState("mes");
  const [chartsReady, setChartsReady] = useState(false);

  useEffect(()=>{
    if(window.Chart){setChartsReady(true);return;}
    const s=document.createElement('script');
    s.src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js";
    s.onload=()=>setChartsReady(true);
    document.head.appendChild(s);
  },[]);

  const ahora = new Date();
  const diasPeriodo = filtroPeriodo==="all"?99999:Number(filtroPeriodo);
  const fechaCorte = new Date(ahora.getTime()-diasPeriodo*86400000);

  const recsFilt = recs.filter(r=>{
    if(filtroArea!=="todas"){
      const cats=filtroArea==="intendencia"?CATS_INTENDENCIA:CATS_ADMINISTRACION;
      if(!cats.includes(r.cat)) return false;
    }
    return new Date(r.createdAt)>=fechaCorte;
  });

  const CAT_LABEL={infraestructura:"Obras",mantenimiento:"Mantenimiento",limpieza:"Limpieza",preparacion:"Preparacion",servicios:"Servicios",cuotas:"Cuotas"};
  const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
  const AREAS_TODAS=[
    {id:"todas",label:"Todas"},
    {id:"infraestructura",label:"Obras"},
    {id:"mantenimiento",label:"Mantenimiento"},
    {id:"limpieza",label:"Limpieza"},
    {id:"preparacion",label:"Preparacion"},
    {id:"servicios",label:"Servicios"},
    {id:"cuotas",label:"Cuotas"},
  ];

  const completadas = recsFilt.filter(r=>r.estadoAvance==="completada");
  const pctComp = recsFilt.length>0?Math.round(completadas.length/recsFilt.length*100):0;

  const diasAsignarArr = recsFilt.filter(r=>r.fechaAsignacion&&r.createdAt).map(r=>{
    const d=(new Date(r.fechaAsignacion)-new Date(r.createdAt))/86400000;
    return d>=0&&d<60?d:null;
  }).filter(x=>x!==null);
  const promAsignar = diasAsignarArr.length>0?(diasAsignarArr.reduce((a,b)=>a+b,0)/diasAsignarArr.length).toFixed(1):null;

  const diasCompletarArr = completadas.filter(r=>(r.fechaCompletada||r.updatedAt)&&r.createdAt).map(r=>{
    const end=r.fechaCompletada||r.updatedAt;
    const d=(new Date(end)-new Date(r.createdAt))/86400000;
    return d>=0&&d<365?d:null;
  }).filter(x=>x!==null);
  const promCompletar = diasCompletarArr.length>0?(diasCompletarArr.reduce((a,b)=>a+b,0)/diasCompletarArr.length).toFixed(1):null;

  const diasConfirmarArr = recsFilt.filter(r=>r.fechaAsignacion&&r.fechaConfirmacion).map(r=>{
    const d=(new Date(r.fechaConfirmacion)-new Date(r.fechaAsignacion))/86400000;
    return d>=0&&d<30?d:null;
  }).filter(x=>x!==null);
  const promConfirmar = diasConfirmarArr.length>0?(diasConfirmarArr.reduce((a,b)=>a+b,0)/diasConfirmarArr.length).toFixed(1):null;

  const diasEjecutarArr = completadas.filter(function(r){return (r.fechaCompletada||r.updatedAt)&&r.fechaConfirmacion;}).map(function(r){
    var end=r.fechaCompletada||r.updatedAt;
    var d=(new Date(end)-new Date(r.fechaConfirmacion))/86400000;
    return d>=0&&d<365?d:null;
  }).filter(function(x){return x!==null;});
  const promEjecutar = diasEjecutarArr.length>0?(diasEjecutarArr.reduce(function(a,b){return a+b;},0)/diasEjecutarArr.length).toFixed(1):null;

  const demoradas = recsFilt.filter(r=>{
    if(["completada","consolidada","vinculado_proyecto"].includes(r.estadoAvance)) return false;
    if(!r.fechaCierre) return false;
    return new Date(r.fechaCierre)<ahora;
  }).length;

  const sinAsignar = recsFilt.filter(r=>
    !["completada","consolidada","vinculado_proyecto"].includes(r.estadoAvance)&&
    (!r.ejecutorMail||r.ejecutorMail.trim()==="")
  ).length;

  const reabiertas = recsFilt.filter(r=>r.reabierta).length;
  const tasaReapertura = completadas.length>0?Math.round(reabiertas/completadas.length*100):0;

  const CATS_ALL = [...CATS_INTENDENCIA,...CATS_ADMINISTRACION];

  const porArea = CATS_ALL.map(cat=>{
    const label=CAT_LABEL[cat]||cat;
    const rArea=recsFilt.filter(r=>r.cat===cat);
    const compArea=rArea.filter(r=>r.estadoAvance==="completada");
    const pct=rArea.length>0?Math.round(compArea.length/rArea.length*100):null;

    const asigArr=rArea.filter(r=>r.fechaAsignacion&&r.createdAt).map(r=>{
      const d=(new Date(r.fechaAsignacion)-new Date(r.createdAt))/86400000;
      return d>=0&&d<60?d:null;
    }).filter(x=>x!==null);
    const tAsig=asigArr.length>0?(asigArr.reduce((a,b)=>a+b,0)/asigArr.length).toFixed(1):null;

    const confirArr=rArea.filter(r=>r.fechaAsignacion&&r.fechaConfirmacion).map(r=>{
      const d=(new Date(r.fechaConfirmacion)-new Date(r.fechaAsignacion))/86400000;
      return d>=0&&d<30?d:null;
    }).filter(x=>x!==null);
    const tConfirm=confirArr.length>0?(confirArr.reduce((a,b)=>a+b,0)/confirArr.length).toFixed(1):null;

    // tEj: confirmar → completar (matches waterfall right side)
    const ejConfArr=compArea.filter(r=>(r.fechaCompletada||r.updatedAt)&&r.fechaConfirmacion).map(r=>{
      const end=r.fechaCompletada||r.updatedAt;
      const d=(new Date(end)-new Date(r.fechaConfirmacion))/86400000;
      return d>=0&&d<365?d:null;
    }).filter(x=>x!==null);
    const tEj=ejConfArr.length>0?(ejConfArr.reduce((a,b)=>a+b,0)/ejConfArr.length).toFixed(1):null;

    // tTotal: creacion → completar (end-to-end, matches left waterfall final bar)
    const ejArr=compArea.filter(r=>(r.fechaCompletada||r.updatedAt)&&r.createdAt).map(r=>{
      const end=r.fechaCompletada||r.updatedAt;
      const d=(new Date(end)-new Date(r.createdAt))/86400000;
      return d>=0&&d<365?d:null;
    }).filter(x=>x!==null);
    const tTotal=ejArr.length>0?(ejArr.reduce((a,b)=>a+b,0)/ejArr.length).toFixed(1):null;

    // Conversion per area (for right waterfall table)
    const aAsignadas=rArea.filter(r=>r.ejecutorMail&&r.ejecutorMail.trim()!=="").length;
    const aConfirmadas=rArea.filter(r=>r.ejecutorConfirmado||(r.ejecutores_lista||[]).some(function(e){return e.confirmado;})).length;
    const aNoAsig=rArea.length-aAsignadas;
    const aNoConf=Math.max(0,aAsignadas-aConfirmadas);
    const aNoComp=Math.max(0,aConfirmadas-compArea.length);
    const aPctAsig=rArea.length>0?Math.round(aAsignadas/rArea.length*100):null;
    const aPctConf=rArea.length>0?Math.round(aConfirmadas/rArea.length*100):null;
    const aPctComp=rArea.length>0?Math.round(compArea.length/rArea.length*100):null;

    const conCalif=compArea.filter(r=>r.calificacion);
    const promCalif=conCalif.length>0?(conCalif.reduce((a,r)=>a+r.calificacion,0)/conCalif.length).toFixed(1):null;

    const reabArea=rArea.filter(r=>r.reabierta).length;
    const tasaReapArea=compArea.length>0?Math.round(reabArea/compArea.length*100):null;

    return {cat,label,total:rArea.length,completadas:compArea.length,pct,tAsig,tConfirm,tEj,tTotal,promCalif,califCount:conCalif.length,tasaReap:tasaReapArea,aAsignadas,aConfirmadas,aNoAsig,aNoConf,aNoComp,aPctAsig,aPctConf,aPctComp};
  }).filter(a=>a.total>0);

  const tendenciaData = (()=>{
    var recsBase = recs.filter(function(r){
      var ok = new Date(r.createdAt) >= fechaCorte;
      if(filtroArea !== "todas"){
        var cats = filtroArea === "intendencia" ? CATS_INTENDENCIA : CATS_ADMINISTRACION;
        if(!cats.includes(r.cat)) ok = false;
      }
      return ok;
    });
    const recsT = filtroAreaTendencia==="todas"?recsBase:recsBase.filter(r=>r.cat===filtroAreaTendencia);
    const map={};
    recsT.forEach(r=>{
      const d=new Date(r.createdAt);
      let key,label;
      if(granularidad==="mes"){
        key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
        label=MESES[d.getMonth()]+" '"+String(d.getFullYear()).slice(2);
      } else {
        const sy=new Date(d.getFullYear(),0,1);
        const wk=Math.ceil(((d-sy)/86400000+sy.getDay()+1)/7);
        key=d.getFullYear()+"-W"+String(wk).padStart(2,"0");
        label="Sem "+wk+" '"+String(d.getFullYear()).slice(2);
      }
      if(!map[key]) map[key]={label,nuevas:0,comp:0};
      map[key].nuevas++;
    });
    recsT.filter(r=>r.estadoAvance==="completada").forEach(r=>{
      const fechaC=r.fechaCompletada||r.updatedAt;
      if(!fechaC) return;
      const d=new Date(fechaC);
      let key;
      if(granularidad==="mes"){
        key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      } else {
        const sy=new Date(d.getFullYear(),0,1);
        const wk=Math.ceil(((d-sy)/86400000+sy.getDay()+1)/7);
        key=d.getFullYear()+"-W"+String(wk).padStart(2,"0");
      }
      if(map[key]) map[key].comp++;
    });
    const entries=Object.entries(map).sort((a,b)=>a[0]>b[0]?1:-1).slice(-18);
    return {
      labels:entries.map(([,v])=>v.label),
      nuevas:entries.map(([,v])=>v.nuevas),
      completadas:entries.map(([,v])=>v.comp),
      tasas:entries.map(([,v])=>v.nuevas>0?Math.round(v.comp/v.nuevas*100):0),
    };
  })();

  const insightTendencia = (()=>{
    const tasas=tendenciaData.tasas;
    if(tasas.length<4) return null;
    const rec3=tasas.slice(-3);
    const ant3=tasas.slice(-6,-3);
    if(!ant3.length) return null;
    const pR=Math.round(rec3.reduce((a,b)=>a+b,0)/rec3.length);
    const pA=Math.round(ant3.reduce((a,b)=>a+b,0)/ant3.length);
    const diff=pR-pA;
    if(Math.abs(diff)<3) return {texto:"Tasa de resolucion estable ("+pR+"% en los ultimos 3 periodos).",color:"#185FA5",bg:"#E6F1FB"};
    if(diff>0) return {texto:"La tasa de resolucion mejoro "+diff+" puntos ("+pA+"% a "+pR+"% en los ultimos 3 periodos).",color:"#3B6D11",bg:"#EAF3DE"};
    return {texto:"La tasa de resolucion cayo "+Math.abs(diff)+" puntos ("+pA+"% a "+pR+"%). Revisar acumulacion de pendientes.",color:"#A32D2D",bg:"#FCEBEB"};
  })();

  const insightCuello = (()=>{
    const etapas=[
      {label:"Creacion a asignacion",val:promAsignar?Number(promAsignar):null},
      {label:"Asignacion a confirmacion",val:promConfirmar?Number(promConfirmar):null},
    ];
    const validas=etapas.filter(e=>e.val!==null);
    if(!validas.length) return null;
    const max=validas.reduce((a,b)=>b.val>a.val?b:a);
    return "Cuello de botella principal: \""+max.label+"\" ("+max.val+"d promedio).";
  })();

  function ChartBox({id,type,data,options,height}){
    const ref=useRef(null);
    const chartRef=useRef(null);
    useEffect(()=>{
      if(!chartsReady||!ref.current) return;
      if(chartRef.current) chartRef.current.destroy();
      chartRef.current=new window.Chart(ref.current,{type,data,options:Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}},options||{})});
      return function(){if(chartRef.current) chartRef.current.destroy();};
    },[chartsReady,JSON.stringify(data)]);
    return h('div',{style:{position:"relative",height:(height||220)+"px",width:"100%"}},
      h('canvas',{ref,role:"img","aria-label":"Grafico"},"Grafico"));
  }

  const card=function(extra){return Object.assign({background:"white",borderRadius:14,border:"1px solid #f1f5f9",padding:"16px 18px"},extra||{});};
  const secLabel=function(txt){return h('div',{style:{fontSize:11,fontWeight:600,color:"#64748b",textTransform:"uppercase",letterSpacing:"1px",margin:"20px 0 10px"}},txt);};
  const colorT=function(v){return v===null?"#94a3b8":Number(v)<=2?"#3B6D11":Number(v)<=5?"#BA7517":"#A32D2D";};
  const colorP=function(v){return v===null?"#94a3b8":v>=70?"#3B6D11":v>=50?"#BA7517":"#A32D2D";};
  const colorC=function(v){return v===null?"#94a3b8":Number(v)>=4?"#3B6D11":Number(v)>=3?"#BA7517":"#A32D2D";};

function puedeInsistir(r) {
  var ahora = new Date();
  var crit = r.criticidad || r.pri || "media";
  var plazo = (ESCALADO[crit] || {dias:3}).dias;
  var terminados = ["completada","consolidada","vinculado_proyecto"];
  if(terminados.includes(r.estadoAvance)) return false;
  if((r.insistencias||0) >= 3) return false;
  if(r.ultimaInsistencia) {
    var diasDesdeUltima = (ahora - new Date(r.ultimaInsistencia)) / 86400000;
    if(diasDesdeUltima < 3) return false;
  }
  // Regla 1: sin asignar y pasó el plazo de criticidad
  var diasCreado = (ahora - new Date(r.createdAt)) / 86400000;
  if(!r.ejecutorMail && diasCreado > plazo) return true;
  // Regla 2: tiene fecha de cierre y se excedió sin resolver
  var fechaCierre = r.fechaCierreActualizada || r.fechaCierreConfirmada || r.fechaCierre;
  if(fechaCierre && new Date(fechaCierre) < ahora) return true;
  return false;
}

      fecha: ahora,
      autor: "Sistema"

  });
  console.log("insistencia step 1 - upsert");

  setRecs(function(prev){ return prev.map(function(x){ return x.id===r.id?updated:x; }); });
  console.log("insistencia step 3 - getCatCfg");
  var catCfg = getCatCfg(r.cat);

  var dirMails = (catCfg.directivos||[]).map(function(x){return x.mail;}).filter(Boolean);

  }
  console.log("insistencia step 5 - done");

              h('div',{style:{fontSize:11,color:"#94a3b8",fontWeight:600,marginBottom:3,textTransform:"uppercase"}},"Fecha tentativa de resolución"),
              rec.fechaCierreConfirmada
                ? h('div',{style:{fontSize:14,fontWeight:600,color:"#1a3a6b"}},fd(rec.fechaCierreConfirmada))
                : h('div',{style:{fontSize:13,color:"#94a3b8",fontStyle:"italic"}},"A definir por intendencia"))),
          h('div',{style:{marginBottom:16}},
            h('div',{style:{fontSize:11,color:"#94a3b8",fontWeight:600,marginBottom:4,textTransform:"uppercase"}},"Descripción"),
            h('div',{style:{fontSize:14,color:"#475569",lineHeight:1.6}},rec.desc)),
          rec.estadoAvance==="vinculado_proyecto" && rec.proyectoTitulo && h('div',{style:{background:"#f5f3ff",border:"1.5px solid #ddd6fe",borderRadius:12,padding:"14px 16px",marginBottom:16}},
            h('div',{style:{fontSize:11,color:"#5b21b6",fontWeight:700,marginBottom:6,textTransform:"uppercase"}},"🏗️ Vinculado a proyecto"),
            h('div',{style:{fontSize:14,fontWeight:600,color:"#4c1d95",marginBottom:4}},rec.proyectoTitulo),
            h('div',{style:{fontSize:13,color:"#6d28d9",lineHeight:1.5}},"Tu solicitud será resuelta como parte de este proyecto. Recibirás actualizaciones a medida que avance.")),
          rec.adjuntos && rec.adjuntos.filter(a=>a.url).length>0 && h('div',{style:{marginBottom:16}},
            h('div',{style:{fontSize:11,color:"#94a3b8",fontWeight:600,marginBottom:8,textTransform:"uppercase"}},"Fotos adjuntas"),
            h('div',{style:{display:"flex",gap:8,flexWrap:"wrap"}},
              ...rec.adjuntos.filter(a=>a.url).map((a,i)=>
                a.tipo?.startsWith("video")
                  ? h('a',{key:i,href:a.url,target:"_blank",style:{display:"inline-flex",alignItems:"center",gap:4,padding:"6px 12px",background:"#f1f5f9",borderRadius:8,fontSize:12,color:"#475569",fontWeight:600,textDecoration:"none"}},"🎥 Ver video")
                  : h('a',{key:i,href:a.url,target:"_blank"},
                      h('img',{src:a.url,alt:a.nombre,style:{width:80,height:80,objectFit:"cover",borderRadius:8,border:"1.5px solid #e2e8f0"}}))))),
          // Resolución si está completada
          rec.estadoAvance==="completada" && rec.descripcionResolucion && h('div',{style:{background:"#f0fdf4",border:"1.5px solid #bbf7d0",borderRadius:12,padding:"14px 16px",marginBottom:16}},
            h('div',{style:{fontSize:11,color:"#15803d",fontWeight:700,marginBottom:6,textTransform:"uppercase"}},"✅ Resolución"),
            h('div',{style:{fontSize:14,color:"#166534",lineHeight:1.6}},rec.descripcionResolucion),
            rec.evidenciaUrl && h('a',{href:rec.evidenciaUrl,target:"_blank",style:{display:"inline-block",marginTop:8,fontSize:13,color:"#15803d",fontWeight:600}},"📎 Ver evidencia →"),
            rec.adjuntosResolucion && rec.adjuntosResolucion.length>0 && h('div',{style:{marginTop:12,display:"flex",gap:8,flexWrap:"wrap"}},
              ...rec.adjuntosResolucion.filter(a=>a.url).map((a,i)=>
                h('a',{key:i,href:a.url,target:"_blank",style:{display:"inline-flex",alignItems:"center",gap:4,padding:"6px 12px",background:"#dcfce7",borderRadius:8,fontSize:12,color:"#15803d",fontWeight:600,textDecoration:"none"}},
                  a.tipo?.startsWith("video")?"🎥":"📷", a.nombre)))),
          // Reabrir si completada
          rec.estadoAvance==="completada" && h('div',{style:{background:"#fff7ed",border:"1.5px solid #fed7aa",borderRadius:10,padding:"12px 16px"}},
            h('div',{style:{fontSize:13,color:"#92400e",marginBottom:8}},"¿Querés calificar la resolución o solicitar reapertura?"),
            h('a',{href:appUrl+"?calificar="+rec.id,style:{display:"inline-block",padding:"8px 20px",background:"#f97316",color:"white",borderRadius:8,fontSize:13,fontWeight:600,textDecoration:"none"}},"⭐ Calificar resolución")))));
  }

  const navBtn = (v, label, active) => h('button',{onClick:()=>setView(v),style:{padding:"8px 16px",borderRadius:20,border:"none",background:active?"#1a3a6b":"rgba(255,255,255,0.9)",color:active?"white":"#374151",cursor:"pointer",fontSize:13,fontWeight:600,boxShadow:"0 2px 12px rgba(0,0,0,0.2)"}},label);

  const recsFiltrados = (area) => recs.filter(r => area==="intendencia"
    ? CATS_INTENDENCIA.includes(r.cat)
    : CATS_ADMINISTRACION.includes(r.cat));

  return h('div',null,
   h('div',{style:{position:"fixed",bottom:16,left:"50%",transform:"translateX(-50%)",zIndex:999,display:"flex",gap:8,padding:"8px 12px",background:"rgba(15,23,42,0.85)",borderRadius:32,backdropFilter:"blur(8px)",boxShadow:"0 4px 24px rgba(0,0,0,0.3)",maxWidth:"calc(100vw - 32px)",overflowX:"auto",WebkitOverflowScrolling:"touch"}},
      navBtn("socio","📋 Ingresa", view==="socio"),
      navBtn("mis_solicitudes","📬 Mis solicitudes", view==="mis_solicitudes"),
      showPanelTabs && navBtn("mis_tareas","📅 Mis tareas", view==="mis_tareas"),
      showPanelTabs && navBtn("intendencia","🔧 Intendencia", view==="intendencia"),
      showPanelTabs && navBtn("administracion","📊 Administración", view==="administracion"),
      showPanelTabs && navBtn("dashboard","📈 Dashboard", view==="dashboard"),
      showPanelTabs && h('button',{onClick:()=>setShowPanelTabs(false),style:{padding:"8px 12px",borderRadius:20,border:"none",background:"rgba(255,255,255,0.15)",color:"white",cursor:"pointer",fontSize:13,fontWeight:600,boxShadow:"0 2px 12px rgba(0,0,0,0.2)",whiteSpace:"nowrap"}},"✕")),
    !showPanelTabs && h('button',{
      onClick:()=>setShowPanelTabs(true),
      style:{position:"fixed",bottom:16,left:16,zIndex:999,background:"rgba(0,0,0,0.15)",border:"none",
        borderRadius:"50%",width:32,height:32,cursor:"pointer",fontSize:14,color:"rgba(0,0,0,0.3)",
        display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}},
      "⚙"),
    view==="socio" && h(FormularioSocio,{onSubmit:add,reclamos:recs}),
    view==="mis_solicitudes" && h(MisSolicitudes,{recs,setRecs,loaded}),
    view==="mis_tareas" && h(MisTareasEjecutor,{recs,setRecs,loaded}),
    view==="intendencia" && !authInt && h(Login,{area:"intendencia",onLogin:()=>{setAuthInt(true);setShowPanelTabs(true);sessionStorage.setItem('authInt','1');}}),
    view==="intendencia" && authInt && h(PanelAdmin,{recs:recsFiltrados("intendencia"),onUpdate:upd,onRefresh:()=>sbGetAll().then(setRecs),area:"intendencia"}),
    view==="administracion" && !authAdm && h(Login,{area:"administracion",onLogin:()=>{setAuthAdm(true);setShowPanelTabs(true);sessionStorage.setItem('authAdm','1');}}),
    view==="administracion" && authAdm && h(PanelAdmin,{recs:recsFiltrados("administracion"),onUpdate:upd,onRefresh:()=>sbGetAll().then(setRecs),area:"administracion"}),
    view==="dashboard" && !authDash && h(Login,{area:"dashboard",onLogin:()=>{setAuthDash(true);setShowPanelTabs(true);sessionStorage.setItem('authDash','1');}}),
    view==="dashboard" && authDash && h(DashboardPanel,{recs}));
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
